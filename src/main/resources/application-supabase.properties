# Supabase / PostgreSQL Configuration Profile
spring.application.name=Khoj

# Cloud Port binding (Render, Railway, Fly.io inject $PORT)
server.port=${PORT:8080}

# Supabase PostgreSQL Connection
# Defaults to your Supabase Transaction Pooler (port 6543) so it never defaults to localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&tcpKeepAlive=true&connectTimeout=30&socketTimeout=60}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres.qdbvilmnudmespmdueem}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pooler Settings for Cloud / Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate Settings
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Disable H2 console in production profile
spring.h2.console.enabled=false

# JWT Configuration (Supports override via environment variables)
application.security.jwt.secret-key=${JWT_SECRET:60f51dceae8d20f68d0fbf37c6c1480117472b807e1844d910e7c5c8e0e7a754}
application.security.jwt.expiration=${JWT_EXPIRATION:900000}
application.security.jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Notification & Sender Details (Email & SMS)
application.notification.mail.from=${MAIL_FROM:support@khojhealth.com}
application.notification.sms.from-sender-id=${SMS_SENDER_ID:KHOJ}
# Default Fast2SMS URL template: replaces {API_KEY}, {MOBILE}, {OTP}
application.notification.sms.api-url=${SMS_API_URL:https://www.fast2sms.com/dev/bulkV2?authorization={API_KEY}&route=otp&variables_values={OTP}&numbers={MOBILE}}
application.notification.sms.api-key=${SMS_API_KEY:}

# SMTP Mail Settings (Using Port 465 SSL with strict 5-second timeouts to prevent cloud freezes)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
