# Supabase / PostgreSQL Configuration Profile
spring.application.name=Khoj

# Cloud Port binding (Render, Railway, Fly.io inject $PORT)
server.port=${PORT:8080}

# Supabase PostgreSQL Connection
# Using environment variables with sensible defaults for Supabase direct / pooler connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pooler Settings for Cloud / Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable H2 console in production profile
spring.h2.console.enabled=false

# JWT Configuration (Supports override via environment variables)
application.security.jwt.secret-key=${JWT_SECRET:60f51dceae8d20f68d0fbf37c6c1480117472b807e1844d910e7c5c8e0e7a754}
application.security.jwt.expiration=${JWT_EXPIRATION:900000}
application.security.jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
