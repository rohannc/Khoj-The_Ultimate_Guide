spring.application.name=Khoj

# H2 Database Connection (In-Memory)
spring.datasource.url=jdbc:h2:mem:khojdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
application.security.jwt.secret-key=60f51dceae8d20f68d0fbf37c6c1480117472b807e1844d910e7c5c8e0e7a754
application.security.jwt.expiration=86400000

# application.properties
logging.level.org.springframework.security=DEBUG